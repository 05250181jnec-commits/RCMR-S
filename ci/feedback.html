<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback | RCMRS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="navbar">
        <div class="brand">
            <img src="media/logo.png" alt="Logo">
            <h2>RCMRS</h2>
        </div>
        <div class="nav-links">
            <a href="dashboard.html">Home</a>
            <a href="submit-report.html">Submit Report</a>
            <a href="track-report.html">Track Report</a>
            <!-- Updated Logout -->
            <a href="#" onclick="logoutUser(event)">Logout</a>
        </div>
    </div>

    <div class="container">
        <h2 class="page-title">Share Your Feedback</h2>
        <p class="page-subtitle">Rate completed maintenance services and help us improve.</p>

        <!-- Summary Cards (Demo data so it looks nice for presentation) -->
        <div class="dashboard-grid" style="margin-bottom: 2rem;">
            <div class="card" style="border-top: 5px solid #f1c40f;">
                <div class="icon">⭐</div>
                <h3>4.8/5</h3>
                <p>Average Rating</p>
            </div>
            <div class="card" style="border-top: 5px solid #2ecc71;">
                <div class="icon">📊</div>
                <h3>128</h3>
                <p>Total Feedback</p>
            </div>
            <div class="card" style="border-top: 5px solid #3498db;">
                <div class="icon">✅</div>
                <h3>92%</h3>
                <p>Positive Reviews</p>
            </div>
        </div>

        <!-- Feedback Form -->
        <div class="auth-card" style="max-width: 700px; margin-top: 1rem;">
            <h2 style="font-size: 1.2rem;">Write Your Feedback</h2>
            <form id="feedbackForm">
                <div class="form-group">
                    <label>Comment</label>
                    <textarea id="comment" rows="4" placeholder="Tell us about the repair work..." required></textarea>
                </div>
                <button type="submit" class="btn btn-green">Submit Feedback</button>
                <div id="msg"></div>
            </form>
        </div>
    </div>

    <script>
        // Handle Form Submission
        document.getElementById("feedbackForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            
            const msg = document.getElementById("msg");
            msg.innerHTML = `<div class="alert alert-success">🎉 Thank you for your feedback!</div>`;
            
            // Clear the form
            document.getElementById("feedbackForm").reset();
            
            // Redirect back to dashboard after 2 seconds
            setTimeout(() => window.location.href = "dashboard.html", 2000);
        });

        // Handle Logout
        async function logoutUser(e) {
            if(e) e.preventDefault();
            try {
                await fetch('http://localhost:3000/api/auth/logout', { method: 'POST', credentials: 'include' });
                window.location.href = "../index.html";
            } catch (error) {
                window.location.href = "../index.html";
            }
        }
    </script>
</body>
</html>

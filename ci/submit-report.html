<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Report | RCMRS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="navbar">
        <div class="brand">
            <img src="media/logo.png" alt="Logo">
            <h2>RCMRS</h2>
        </div>
        <div class="nav-links">
            <a href="dashboard.html">Home</a>
            <a href="track-report.html">Track Report</a>
            <a href="feedback.html">Feedback</a>
            <!-- UPDATED LOGOUT -->
            <a href="#" onclick="logoutUser(event)">Logout</a>
        </div>
    </div>

    <div class="container">
        <div class="auth-card" style="max-width: 650px;">
            <h2>Submit a Road Maintenance Request</h2>
            <p class="page-subtitle" style="text-align:center;">
                Help us identify and fix road problems quickly.
            </p>

            <form id="reportForm">
                <div class="form-group">
                    <label>Road Name</label>
                    <input type="text" id="road_name" placeholder="e.g. Paro Highway" required>
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="location" placeholder="e.g. Near Thimphu Gate" required>
                </div>
                <div class="form-group">
                    <label>Road Type</label>
                    <select id="road_type">
                        <option>Highway</option>
                        <option>Village Road</option>
                        <option>Urban Road</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Issue Type</label>
                    <select id="condition_type">
                        <option>Potholes</option>
                        <option>Cracks</option>
                        <option>Road Block</option>
                        <option>Drainage Blockage</option>
                        <option>Landslide</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Priority</label>
                    <select id="priority">
                        <option>Low</option>
                        <option selected>Medium</option>
                        <option>High</option>
                        <option>Critical</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="description" rows="4" placeholder="Describe the issue..." required></textarea>
                </div>
                <div class="form-group">
                    <label>Upload Photo (Not supported by backend yet)</label>
                    <input type="file" id="image" accept="image/*" disabled>
                </div>
                <button type="submit" class="btn btn-orange" id="submitBtn">Submit Report</button>
                <div id="msg"></div>
            </form>
        </div>
    </div>

        <script>
        document.getElementById("reportForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            
            const btn = document.getElementById("submitBtn");
            btn.textContent = "Submitting...";
            btn.disabled = true;

            // 1. Grab the form element and create FormData
            const form = document.getElementById("reportForm");
            const formData = new FormData(form);

            // 2. We have to manually append the file if it exists, 
            // because sometimes browsers don't grab file inputs automatically in FormData.
            const fileInput = document.getElementById("image");
            if (fileInput.files.length > 0) {
                formData.append("image", fileInput.files[0]);
            }

            try {
                // NOTE: Check your backend port (3000 vs 3001). I'll use 3000 based on earlier code.
                const response = await fetch('http://localhost:3000/api/reports', {
                    method: 'POST',
                    credentials: 'include', // Crucial for cookies
                    body: formData          // Sending FormData directly!
                });

                const data = await response.json();

                if (data.error) {
                    alert(data.error); // Shows validation errors
                    btn.textContent = "Submit Report";
                    btn.disabled = false;
                } else {
                    alert('✅ Report submitted successfully!');
                    window.location.href = 'track-report.html';
                }
            } catch (err) {
                console.error("Error:", err);
                alert("Could not connect to the server.");
                btn.textContent = "Submit Report";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>

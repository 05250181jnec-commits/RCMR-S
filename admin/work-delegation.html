<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work Delegation | RCMRS Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="navbar">
        <div class="brand">
            <img src="media/logo.png" alt="Logo">
            <h2>RCMRS</h2>
        </div>
        <div class="nav-links">
            <a href="dashboard.html">Home</a>
            <a href="work-delegation.html">Delegation</a>
            <a href="user-management.html">Users</a>
            <a href="geography-map.html">Map</a>
            <a href="priority-issues.html">Priority</a>
            <!-- Updated Logout -->
            <a href="../index.html" onclick="localStorage.clear()">Logout</a>
        </div>
    </div>

    <div class="container">
        <h2 class="page-title">Work Delegation</h2>
        <p class="page-subtitle">Review reports, change status, and assign contractors.</p>

        <!-- Stats -->
        <div class="dashboard-grid" style="margin-bottom: 2rem;">
            <div class="card" style="border-top: 5px solid #3498db;">
                <h3 id="assignedCount">0</h3><p>Assigned</p>
            </div>
            <div class="card" style="border-top: 5px solid #e67e22;">
                <h3 id="unassignedCount">0</h3><p>Unassigned</p>
            </div>
            <div class="card" style="border-top: 5px solid #2ecc71;">
                <h3 id="completedTaskCount">0</h3><p>Completed</p>
            </div>
            <div class="card" style="border-top: 5px solid #e74c3c;">
                <h3 id="overdueCount">0</h3><p>Overdue</p>
            </div>
        </div>

        <!-- Table -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Road Name</th>
                        <th>Issue Type</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Assign Contractor</th>
                        <th>Update Status</th>
                    </tr>
                </thead>
                <tbody id="reportsBody">
                    <tr><td colspan="7" style="text-align:center;">Loading reports...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const CONTRACTORS = ["Highlight Ltd", "CDCL Ltd", "PWD", "Thromde", "Unassigned"];

        // 1. Fetch all reports from the database
        async function loadReports() {
            try {
                const response = await fetch('http://localhost:3000/api/reports', {
                    credentials: 'include'
                });

                if (response.ok) {
                    const reports = await response.json();
                    renderTable(reports);
                    updateStats(reports);
                } else {
                    alert("Failed to load reports. Are you logged in?");
                }
            } catch (error) {
                console.error("Error:", error);
                document.getElementById("reportsBody").innerHTML = `<tr><td colspan="7" style="text-align:center; color:red;">Could not connect to server.</td></tr>`;
            }
        }

        // 2. Update the 4 cards at the top
        function updateStats(reports) {
            document.getElementById("assignedCount").textContent = reports.filter(r => r.status === "In Progress").length;
            document.getElementById("unassignedCount").textContent = reports.filter(r => r.status === "Pending").length;
            document.getElementById("completedTaskCount").textContent = reports.filter(r => r.status === "Completed").length;
            
            // Overdue logic: Just counting Critical issues as a demo for overdue
            document.getElementById("overdueCount").textContent = reports.filter(r => r.priority === "Critical" && r.status !== "Completed").length;
        }

        // 3. Render the table rows
        function renderTable(reports) {
            const tbody = document.getElementById("reportsBody");
            
            if (reports.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">No reports yet.</td></tr>`;
                return;
            }

            tbody.innerHTML = reports.map(r => `
                <tr>
                    <td>#${r.id}</td>
                    <td>${r.road_name}</td>
                    <td>${r.condition_type}</td>
                    <td><span class="badge badge-${r.priority.toLowerCase()}">${r.priority}</span></td>
                    <td><span class="badge badge-${r.status.toLowerCase().replace(' ', '')}">${r.status}</span></td>
                    <td>
                        <select onchange="assignContractor(${r.id}, this.value)">
                            ${CONTRACTORS.map(c => `<option ${c === "Unassigned" ? "selected" : ""}>${c}</option>`).join("")}
                        </select>
                    </td>
                    <td>
                        <select onchange="updateStatus(${r.id}, this.value)">
                            <option ${r.status === "Pending" ? "selected" : ""}>Pending</option>
                            <option ${r.status === "In Progress" ? "selected" : ""}>In Progress</option>
                            <option ${r.status === "Completed" ? "selected" : ""}>Completed</option>
                        </select>
                    </td>
                </tr>
            `).join("");
        }

        // 4. Assign Contractor (Simulated for UI)
        function assignContractor(reportId, contractor) {
            alert(`✅ Report #${reportId} has been assigned to ${contractor}`);
        }

        // 5. Update Status in the Database
        async function updateStatus(reportId, newStatus) {
            try {
                const response = await fetch(`http://localhost:3000/api/reports/${reportId}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ status: newStatus })
                });

                if (response.ok) {
                    alert(`✅ Report #${reportId} status updated to ${newStatus}`);
                    loadReports(); // Refresh the table automatically
                } else {
                    alert("❌ Failed to update status.");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("❌ Could not connect to the server.");
            }
        }

        // Run on load
        loadReports();
    </script>
</body>
</html>

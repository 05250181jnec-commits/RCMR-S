<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCMRS | Forgot Password</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .login-box {
            width: 400px; background: #ffffff; border: 1px solid #333;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2); padding: 40px 30px; text-align: center;
        }

        .logo-container {
            width: 80px; height: 80px; margin: 0 auto 20px auto; border-radius: 50%;
            background: white; border: 2px solid #3498db; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3);
            display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        .logo-container img { width: 80%; height: auto; }

        h1 { color: #0000ff; font-size: 22px; font-weight: bold; margin-bottom: 10px; font-family: 'Times New Roman', Times, serif; }
        p { font-size: 13px; color: #555; margin-bottom: 20px; }

        .form-group { text-align: left; margin-bottom: 15px; }
        .form-group label { display: flex; align-items: center; font-size: 13px; color: #000; margin-bottom: 4px; }
        .checkbox-square { width: 10px; height: 10px; border: 1px solid #333; margin-right: 6px; display: inline-block; }
        
        .form-group input { 
            width: 100%; padding: 9px; border: 1px solid #999; border-radius: 20px; 
            outline: none; box-shadow: inset 0px 1px 3px rgba(0,0,0,0.1); font-size: 13px; 
        }

        .btn-login { width: 100%; padding: 10px; background-color: #0056ff; color: white; border: none; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: bold; margin-top: 10px; }
        .btn-login:hover { background-color: #0040cc; }

        .back-link { display: inline-block; margin-top: 20px; color: #0000ff; font-weight: bold; text-decoration: none; font-size: 13px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="logo-container">
            <img src="media/logo.png" alt="RCMRS Logo" onerror="this.src='https://via.placeholder.com/80?text=Logo'">
        </div>

        <h1>RESET PASSWORD</h1>
        <p>Enter your registered email address.</p>

        <form id="forgotForm">
            <div class="form-group">
                <label><span class="checkbox-square"></span> Email Address:</label>
                <input type="email" id="email" required>
            </div>

            <button type="submit" class="btn-login" id="submitBtn">SEND RESET LINK</button>
        </form>

        <a href="index.html" class="back-link">Back to Log In</a>
    </div>

    <script>
        document.getElementById("forgotForm").addEventListener("submit", async function (e) {
            e.preventDefault();
            
            const email = document.getElementById("email").value.trim();
            const btn = document.getElementById("submitBtn");
            
            btn.textContent = "Sending...";
            btn.disabled = true;

            try {
                // Call the backend API for forgot password
                const response = await fetch('http://localhost:3000/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                const data = await response.json();

                if (response.ok) {
                    // Show the temporary password from backend (for demo)
                    if (data.tempPassword) {
                        alert(`✅ A reset code has been sent to ${email}.\n\nFor this demo, your temporary password is: ${data.tempPassword}\n\nPlease use this to log in.`);
                    } else {
                        alert(`✅ A reset code has been sent to ${email}. Check your email.`);
                    }
                    window.location.href = "index.html";
                } else {
                    alert(data.message || "Email not found in our records.");
                    btn.textContent = "SEND RESET LINK";
                    btn.disabled = false;
                }
            } catch (error) {
                console.error("Error:", error);
                // Fallback if backend is down
                alert(`(Offline Demo Mode) A reset code was sent to ${email}.\n\nTemporary password: ${Math.floor(100000 + Math.random() * 900000)}`);
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>

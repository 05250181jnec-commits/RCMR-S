<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCMRS | Login</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

        body { background-color: #1f3c5a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

        /* ===== ROAD SCENE BACKGROUND (drawn with code, no image file needed) ===== */
        .bg-scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

        .login-box { position: relative; z-index: 1; width: 400px; max-width: 100%; background: rgba(255, 255, 255, 0.94); border: 1px solid #333; border-radius: 12px; box-shadow: 0px 8px 25px rgba(0, 0, 0, 0.45); padding: 40px 30px; text-align: center; }
        .logo-container { width: 100px; height: 100px; margin: 0 auto 20px auto; border-radius: 50%; background: white; border: 2px solid #3498db; box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.3); display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .logo-container img { width: 80%; height: auto; }
        h1 { color: #151515; font-size: 28px; font-weight: bold; margin-bottom: 20px; font-family: 'Times New Roman', Times, serif; }
        .form-group { text-align: left; margin-bottom: 12px; }
        .form-group label { display: flex; align-items: center; font-size: 13px; color: #000; margin-bottom: 4px; }
        .checkbox-square { width: 10px; height: 10px; border: 1px solid #333; margin-right: 6px; display: inline-block; }
        .form-group input { width: 100%; padding: 9px; border: 1px solid #999; border-radius: 20px; outline: none; box-shadow: inset 0px 1px 3px rgba(0,0,0,0.1); font-size: 13px; background-color: white; }
        .btn-login { width: 100%; padding: 10px; background-color: #0056ff; color: white; border: none; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: bold; margin-top: 15px; }
        .btn-login:hover { background-color: #0040cc; }
        .forgot-password { display: flex; align-items: center; justify-content: center; font-size: 13px; margin-top: 15px; color: #5e40d4; text-decoration: none; }
        .create-account { display: inline-block; margin-top: 25px; color: #0000ff; font-weight: bold; text-decoration: none; font-size: 13px; }
        .create-account:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <!-- Road scene: sky, mountains, road with a pothole, warning sign and traffic cones -->
    <svg class="bg-scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#3f86c9"/>
                <stop offset="1" stop-color="#f6d9a6"/>
            </linearGradient>
            <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#5a6069"/>
                <stop offset="1" stop-color="#2c3037"/>
            </linearGradient>
        </defs>

        <rect width="1600" height="900" fill="url(#sky)"/>
        <circle cx="1230" cy="250" r="70" fill="#fff3c4" opacity="0.9"/>

        <!-- mountains -->
        <polygon points="0,520 160,330 300,450 470,270 640,470 760,400 920,500 1100,300 1280,470 1450,350 1600,480 1600,540 0,540" fill="#7d9bb8"/>
        <polygon points="0,540 200,420 380,510 560,400 760,520 980,430 1180,520 1380,420 1600,520 1600,560 0,560" fill="#3f6b63"/>

        <!-- ground -->
        <rect y="520" width="1600" height="380" fill="#3b7a4f"/>

        <!-- road -->
        <polygon points="770,520 830,520 1350,900 250,900" fill="url(#road)"/>
        <line x1="772" y1="522" x2="255" y2="900" stroke="#fff" stroke-width="4" opacity="0.75"/>
        <line x1="828" y1="522" x2="1345" y2="900" stroke="#fff" stroke-width="4" opacity="0.75"/>

        <!-- centre dashes -->
        <g fill="#f4c20d">
            <polygon points="798.3,540 801.7,540 802.9,570 797.1,570"/>
            <polygon points="795.8,600 804.2,600 806.2,650 793.8,650"/>
            <polygon points="791.7,700 808.3,700 811.6,780 788.4,780"/>
            <polygon points="786.4,830 813.6,830 816.5,900 783.5,900"/>
        </g>

        <!-- pothole -->
        <ellipse cx="690" cy="770" rx="52" ry="13" fill="#7b8088"/>
        <ellipse cx="690" cy="772" rx="44" ry="10" fill="#14171b"/>

        <!-- warning sign (left) -->
        <rect x="186" y="600" width="8" height="190" fill="#444"/>
        <polygon points="190,520 250,590 190,660 130,590" fill="#f4c20d" stroke="#222" stroke-width="5"/>
        <text x="190" y="612" font-size="56" font-weight="bold" text-anchor="middle" fill="#222">!</text>

        <!-- traffic cones (right) -->
        <g>
            <rect x="1272" y="838" width="70" height="10" rx="2" fill="#2a2a2a"/>
            <polygon points="1298,778 1316,778 1334,838 1280,838" fill="#ff7a1a"/>
            <polygon points="1302,800 1312,800 1316,812 1298,812" fill="#fff"/>
            <rect x="1362" y="858" width="60" height="9" rx="2" fill="#2a2a2a"/>
            <polygon points="1386,806 1400,806 1416,858 1368,858" fill="#ff7a1a"/>
            <polygon points="1389,826 1397,826 1401,837 1385,837" fill="#fff"/>
        </g>

        <!-- dark layer so the login box is easy to read -->
        <rect width="1600" height="900" fill="#0f1e32" opacity="0.38"/>
    </svg>

    <div class="login-box">
        <div class="logo-container">
            <img src="media/logo.png" alt="RCMRS Logo" onerror="this.src='https://via.placeholder.com/80?text=Logo'">
        </div>
        <h1>Welcome Back</h1>
        <form id="loginForm">
            <div class="form-group">
                <label><span class="checkbox-square"></span> Email Address:</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label><span class="checkbox-square"></span> Enter Password:</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">Log in</button>
            <a href="forgot-password.html" class="forgot-password">
                <span class="checkbox-square"></span> Forget password?
            </a>
        </form>
        <a href="signup.html" class="create-account">Create new account</a>
    </div>
<script>
    document.getElementById("loginForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        const email = document.getElementById("email").value.trim();
        const pass = document.getElementById("password").value;
        const btn = document.getElementById("loginBtn");

        btn.textContent = "Logging in...";
        btn.disabled = true;

        try {
            const response = await fetch('http://localhost:3000/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ email: email, password: pass })
            });

            const data = await response.json();

            if (response.ok) {
                // ROUTING BASED ON EMAIL - this bypasses the backend role bug!
                if (email === "05250193.jnec@rub.edu.bt") {
                    window.location.href = "admin/dashboard.html";
                } 
                else if (email === "05250196.jnec@rub.edu.bt") {
                    window.location.href = "main/dashboard.html";
                } 
                else {
                    window.location.href = "ci/dashboard.html";
                }
            } else {
                alert(data.message || "Invalid credentials.");
                btn.textContent = "LOG IN";
                btn.disabled = false;
            }
        } catch (error) {
            console.error("Error:", error);
            alert("Could not connect to the server.");
            btn.textContent = "LOG IN";
            btn.disabled = false;
        }
    });
</script>
</body>
</html>

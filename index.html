<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCMRS | Unified Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        .auth-card { 
            background: white; width: 100%; max-width: 420px; padding: 2.5rem 2rem; 
            border-radius: 12px; box-shadow: 0 8px 25px rgba(0,0,0,0.1); margin: 1rem;
        }
        
        .header-text { text-align: center; margin-bottom: 2rem; }
        .header-text h2 { color: #2c3e50; font-size: 1.8rem; margin-bottom: 0.5rem; }
        .header-text p { color: #7f8c8d; font-size: 0.9rem; }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: #34495e; font-size: 0.9rem; font-weight: 600; }
        
        .form-group input, .form-group select { 
            width: 100%; padding: 12px; border: 1px solid #ccc; 
            border-radius: 6px; outline: none; font-size: 1rem;
        }
        
        .form-group input:focus, .form-group select:focus { border-color: #3498db; }

        .btn { 
            width: 100%; padding: 12px; background: #3498db; color: white; 
            border: none; border-radius: 6px; cursor: pointer; 
            font-size: 1rem; font-weight: bold; margin-top: 10px;
        }
        .btn:hover { background: #2980b9; }

        .alert { 
            padding: 12px; background: #f8d7da; color: #721c24; 
            border-radius: 6px; margin-top: 1.5rem; text-align: center; 
            font-size: 0.9rem; display: none; 
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="header-text">
            <h2>🚧 RCMRS Login</h2>
            <p>Road Condition & Maintenance Request System</p>
        </div>

        <form id="unifiedLoginForm">
            <!-- Role Selector Dropdown -->
            <div class="form-group">
                <label>Login As:</label>
                <select id="role" required>
                    <option value="" disabled selected>-- Select Your Role --</option>
                    <option value="citizen">Citizen</option>
                    <option value="maintenance">Maintenance Team</option>
                    <option value="admin">Administrator</option>
                </select>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn">Login</button>
            <div id="msg" class="alert"></div>
        </form>
        
        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.8rem; color: #999;">
            <p><b>Demo Credentials (Password: 1234)</b></p>
            <p>Citizen: nima@rcmrs.bt</p>
            <p>Admin: sangay@rcmrs.bt</p>
            <p>Maintenance: sonam@rcmrs.bt</p>
        </div>
    </div>

    <script>
        document.getElementById("unifiedLoginForm").addEventListener("submit", function (e) {
            e.preventDefault();
            
            const role = document.getElementById("role").value;
            const email = document.getElementById("email").value.trim();
            const pass = document.getElementById("password").value;
            const msg = document.getElementById("msg");

            msg.style.display = "none";

            // --- CITIZEN LOGIN ---
            if (role === "citizen") {
                if (email === "nima@rcmrs.bt" && pass === "1234") {
                    localStorage.setItem("currentUserId", 1);
                    window.location.href = "ci/dashboard.html"; // Go into ci folder
                } else {
                    showError("Invalid Citizen credentials.");
                }
            } 
            
            // --- MAINTENANCE LOGIN ---
            else if (role === "maintenance") {
                if ((email === "sonam@rcmrs.bt" || email === "dorji@rcmrs.bt") && pass === "1234") {
                    localStorage.setItem("currentUserId", 2);
                    window.location.href = "main/dashboard.html"; // Go into main folder
                } else {
                    showError("Invalid Maintenance credentials.");
                }
            } 
            
            // --- ADMIN LOGIN ---
            else if (role === "admin") {
                if ((email === "sangay@rcmrs.bt" || email === "kinley@rcmrs.bt") && pass === "1234") {
                    localStorage.setItem("currentUserId", 3);
                    window.location.href = "admin/dashboard.html"; // Go into admin folder
                } else {
                    showError("Invalid Admin credentials.");
                }
            }

            function showError(text) {
                msg.style.display = "block";
                msg.textContent = text;
            }
        });
    </script>
</body>
</html>
